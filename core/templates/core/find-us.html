{% extends 'base.html' %}
{% load static %}


{% block title %}
Gypsy Swing Revue | Find Us
{% endblock title %}

{% block content %}

  <section class="panel">
    <h1>Find Us</h1>
      <h2>Site Links</h2>
      <ul class="find-us__site">
        <li>
          <a class="" href="/schedule">
            Schedule
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </li>
        <li>
          <a class="" href="/contact">
            Contact
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </li>
      </ul> 
        
      <h2>Web Links</h2>
        <ul class="find-us__web">
        {% for link in social_links%}
          <li>
            <a class="" href={{link.url}}>
              <i class="fa-brands {{ link.icon }}"></i>
              {{link.content}}
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
          </li>
        {% endfor %}
      </ul> 
  </section>

{% endblock content %}
