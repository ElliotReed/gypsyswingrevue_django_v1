{% for event in events %}
<li class="performance">
  {% include 'core/partials/performance-datetime.html' with events=events %}

  <h2 class="performance__title heading-3">
    <a href="{% url 'core:schedule_detail' event.id %}">{{event.event_name}}</a>
  </h2>

  <dl class="performance__details">
    {% include 'core/partials/performance-venue.html' with events=events %}
  </dl>
</li>
{% endfor %}
