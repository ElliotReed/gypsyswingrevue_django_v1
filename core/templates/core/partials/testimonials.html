<div data-testimonial id="{{ id }}"" class="testimonials">
{% for testimonial in testimonials %}
  <figure>
    <blockquote>
      {{testimonial.quote}}
    </blockquote>
    <figcaption>
      <cite title="{{testimonial.title}}">
        {{testimonial.citation}}
      </cite>
    </figcaption>
  </figure>
{% endfor %}
</div>
