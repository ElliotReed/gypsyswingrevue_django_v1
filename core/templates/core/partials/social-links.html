  <ul class="link-list">
  {% for link in social_links%}
    <li>
      <a class="" href={{link.url}}>
        <i 
          aria-hidden="true" 
          class="fa-brands {{ link.icon }} fa-lg"
      ></i>
        {{link.content}}
        <i 
          aria-hidden="true" 
          class="fa-solid fa-arrow-up-right-from-square fa-xs"
        ></i>
        <span class="visually-hidden">(opens in new tab)</span>
      </a>
    </li>
  {% endfor %}
</ul>
