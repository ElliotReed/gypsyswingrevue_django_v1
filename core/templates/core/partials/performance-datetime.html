  <div class="performance__datetime">
    <time 
    class="performance__datetime-date" 
    datetime="{{event.event_date|date:'Y-m-d'}}"
    >
    {{event.event_date|date:"F j, Y"}}
    </time>

    <div class="performance__datetime-time-display">
      <time class="performance__datetime-start" datetime={{event.event_start|time:"g:i"}}>
        {{event.event_start|time:"g:i a"}}
      </time>
      <span class="performance__datetime-to">&nbsp;to&nbsp;</span>
      <time class="performance__datetime-end" datetime={{event.event_start|time:"g:i"}}>
        {{event.event_end|time:"g:i a"}}
      </time>
    </div>
  </div>
