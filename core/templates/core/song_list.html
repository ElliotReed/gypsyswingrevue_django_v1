{% extends 'base.html' %}
{% load static %}

{% block title %}
  Gypsy Swing Revue | The Music
{% endblock title %}

{% block content %}
  <section class="songlist panel" id="songlist">
    <h1 name="songlist">Gypsy Swing Revue Song List</h1>

    <ol>
      {% for song in song_list %}
        <li>{{song.song.title}}</li>
      {% endfor %}
    </ol>
  </section>
{% endblock content %}
